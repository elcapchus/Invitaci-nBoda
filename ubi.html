<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navegación Boda - Estilo Compacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&display=swap');
        
        :root {
            --ios-blue: #007AFF;
            --wedding-gold: #D4AF37;
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .ios-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        #permission-overlay {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #map {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 1;
        }

        /* Instrucciones Superiores más delgadas */
        .instruction-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 100;
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transform: translateY(-150%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .instruction-panel.active {
            transform: translateY(0);
        }

        /* Panel Inferior Flotante (no ocupa todo el ancho) */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            border-radius: 24px;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn-apple {
            background: var(--ios-blue);
            color: white;
            padding: 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
            border: none;
        }

        .btn-apple:active { transform: scale(0.97); }

        .btn-secondary {
            background: rgba(0, 122, 255, 0.08);
            color: var(--ios-blue);
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .car-emoji {
            font-size: 32px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        .pulse-signal {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(0, 122, 255, 0.15);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .leaflet-control-attribution, .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <!-- Overlay Inicial -->
    <div id="permission-overlay">
        <div class="mb-8">
            <div class="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-location-arrow text-blue-500 text-3xl animate-bounce"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Guía en tiempo real</h1>
            <p class="text-slate-500 max-w-xs mx-auto text-sm">Navegación paso a paso hasta el evento.</p>
        </div>
        <button onclick="solicitarUbicacion()" class="bg-black text-white px-10 py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all">
            Iniciar
        </button>
    </div>

    <!-- Instrucciones Superiores (Compacto) -->
    <div id="instruction-card" class="instruction-panel ios-glass">
        <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center shadow-md shrink-0">
            <i id="instruction-icon" class="fas fa-arrow-up text-white text-lg"></i>
        </div>
        <div class="overflow-hidden">
            <p id="next-step-dist" class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter">En 50m</p>
            <p id="instruction-text" class="text-[15px] font-bold text-slate-900 leading-tight truncate">Calculando indicaciones...</p>
        </div>
    </div>

    <div id="map"></div>

    <!-- Panel Inferior (Compacto) -->
    <div class="info-panel ios-glass">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h2 class="text-lg font-bold text-slate-900 tracking-tight">Destino Final</h2>
                <span id="distancia-txt" class="text-slate-500 text-xs font-medium">Buscando ruta...</span>
            </div>
            <div id="live-badge" class="hidden flex items-center gap-1.5 bg-green-50 px-2 py-1 rounded-full border border-green-100">
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-bold text-green-700 uppercase">En Vivo</span>
            </div>
        </div>

        <!-- Nota Mini -->
        <div class="bg-amber-50/50 border border-amber-100/50 p-2.5 rounded-xl mb-4 flex gap-2.5">
            <i class="fas fa-info-circle text-amber-500 text-xs mt-0.5"></i>
            <p class="text-[11px] text-amber-800 leading-tight">
                Habrá un <b>Ujier</b> en la entrada para asistirte.
            </p>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <button id="btn-start-nav" onclick="activarSeguimientoTotal()" class="btn-apple">
                <i class="fas fa-location-crosshairs text-sm"></i>
                Centrar
            </button>
            
            <a href="https://www.google.com/maps/dir/Iglesia+El+Valle+Del+Jord%C3%A1n,+4X8C%2B5QX,+Av.+Parque+Zonal,+Carabayllo+15318/-11.6961235,-76.8487518/-11.6959217,-76.8489077/@-11.8731698,-77.0265322,2515m/data=!3m1!1e3!4m15!4m14!1m10!1m1!1s0x9105d095fc08278d:0xe5d895936844abc6!2m2!1d-77.0281012!2d-11.8846285!3m4!1m2!1d-77.0205148!2d-11.8706788!3s0x9105d0afc7795053:0xb060f5c08ef9f2a4!1m0!1m0!3e0?authuser=0&entry=ttu&g_ep=EgoyMDI2MDQyOS4wIKXMDSoASAFQAw%3D%3D" 
               target="_blank" class="btn-secondary">
                <i class="fab fa-google"></i>
                Maps
            </a>
        </div>
        <p id="accuracy-txt" class="text-[9px] text-center mt-3 text-slate-400 font-medium uppercase tracking-widest">Señal GPS: --</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <script>
        let map, userMarker, routingControl, watchId;
        let isFollowing = false;
        let lastLat, lastLng;
        const coordsLlegada = [-11.696194, -76.848611];
        const NAV_ZOOM = 17;

        window.onload = function() {
            map = L.map('map', { 
                zoomControl: false,
                inertia: true,
                inertiaDeceleration: 3000,
                tap: true
            }).setView(coordsLlegada, 15);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(map);

            const destIcon = L.divIcon({
                className: 'dest-pin',
                html: `<div style="background:var(--wedding-gold); width:28px; height:28px; border-radius:50%; border:3px solid white; box-shadow:0 4px 12px rgba(212,175,55,0.4); display:flex; align-items:center; justify-content:center;"><i class="fas fa-heart" style="color:white; font-size:12px;"></i></div>`,
                iconSize: [28, 28]
            });
            L.marker(coordsLlegada, {icon: destIcon}).addTo(map);
            
            map.on('dragstart', () => {
                if (isFollowing) {
                    isFollowing = false;
                    document.getElementById('btn-start-nav').innerHTML = '<i class="fas fa-crosshairs text-sm"></i> Seguir';
                    document.getElementById('live-badge').classList.add('hidden');
                }
            });
        };

        function solicitarUbicacion() {
            document.getElementById('permission-overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('permission-overlay').remove(); }, 600);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        actualizarPosicion(pos);
                        activarSeguimientoTotal();
                    },
                    (err) => { document.getElementById('distancia-txt').innerText = "Habilita el GPS"; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function activarSeguimientoTotal() {
            isFollowing = true;
            document.getElementById('btn-start-nav').innerHTML = '<i class="fas fa-navigation text-[10px]"></i> Guía OK';
            document.getElementById('live-badge').classList.remove('hidden');
            document.getElementById('instruction-card').classList.add('active');
            
            if (lastLat && lastLng) {
                map.flyTo([lastLat, lastLng], NAV_ZOOM, { duration: 1.5 });
            }
            iniciarWatch();
        }

        function actualizarPosicion(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy.toFixed(0);
            const userCoords = [lat, lng];
            
            document.getElementById('accuracy-txt').innerText = `Precisión: ${accuracy}m`;

            let rotation = 0;
            if (lastLat && lastLng) {
                const dy = lat - lastLat;
                const dx = lng - lastLng;
                if (Math.abs(dy) > 0.00001 || Math.abs(dx) > 0.00001) {
                    rotation = Math.atan2(dy, dx) * 180 / Math.PI;
                    rotation = 90 - rotation;
                }
            }

            lastLat = lat;
            lastLng = lng;

            if (!userMarker) {
                const carIcon = L.divIcon({
                    className: 'car-container',
                    html: `<div class="pulse-signal"></div><div class="car-emoji" id="car-img" style="font-size: 32px">🚗</div>`,
                    iconSize: [50, 50]
                });
                userMarker = L.marker(userCoords, {icon: carIcon}).addTo(map);
                trazarRuta(userCoords, coordsLlegada);
            } else {
                userMarker.setLatLng(userCoords);
                const carEl = document.getElementById('car-img');
                if (carEl) carEl.style.transform = `rotate(${rotation}deg)`;
                
                if (routingControl) {
                    routingControl.spliceWaypoints(0, 1, L.latLng(userCoords));
                }
            }

            if (isFollowing) {
                map.panTo(userCoords, { animate: true, duration: 1.5 });
            }
        }

        function iniciarWatch() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(
                (pos) => actualizarPosicion(pos),
                null,
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        function trazarRuta(inicio, fin) {
            if (routingControl) map.removeControl(routingControl);

            routingControl = L.Routing.control({
                waypoints: [L.latLng(inicio[0], inicio[1]), L.latLng(fin[0], fin[1])],
                lineOptions: {
                    styles: [
                        { color: '#007AFF', opacity: 0.1, weight: 10 },
                        { color: '#007AFF', opacity: 1, weight: 5 }
                    ]
                },
                createMarker: () => null,
                addWaypoints: false,
                fitSelectedRoutes: false,
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' })
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const route = e.routes[0];
                const summary = route.summary;
                const tiempo = Math.round(summary.totalTime / 60);
                
                document.getElementById('distancia-txt').innerHTML = 
                    `<b class="text-blue-600">${tiempo} min</b> de viaje`;

                if (route.instructions && route.instructions.length > 0) {
                    const next = route.instructions[0];
                    document.getElementById('instruction-text').innerText = traducirManiobra(next.text);
                    document.getElementById('next-step-dist').innerText = `En ${Math.round(next.distance)}m`;
                    actualizarIcono(next.type);
                }
            });
        }

        function traducirManiobra(text) {
            return text.replace(/\bHead\b/g, 'Dirígete')
                       .replace(/\bTurn left\b/g, 'Gira a la izquierda')
                       .replace(/\bTurn right\b/g, 'Gira a la derecha')
                       .replace(/\bKeep left\b/g, 'Mantente a la izquierda')
                       .replace(/\bKeep right\b/g, 'Mantente a la derecha')
                       .replace(/\bat the roundabout\b/g, 'en la rotonda')
                       .replace(/\bonto\b/g, 'hacia')
                       .replace(/\bwest\b/gi, 'al oeste')
                       .replace(/\beast\b/gi, 'al este')
                       .replace(/\bnorth\b/gi, 'al norte')
                       .replace(/\bsouth\b/gi, 'al sur')
                       .replace(/\bon\b/g, 'por');
        }

        function actualizarIcono(type) {
            const icon = document.getElementById('instruction-icon');
            if (type.includes('Left')) icon.className = "fas fa-arrow-turn-up fa-flip-horizontal text-white text-base";
            else if (type.includes('Right')) icon.className = "fas fa-arrow-turn-up text-white text-base";
            else icon.className = "fas fa-arrow-up text-white text-base";
        }
    </script>
</body>
</html>
